# Technology Stack Decisions
# Written by: nch2:1-shape (recon or stack agreement)
# Same-category entries get updated, not duplicated.

decisions:
  - category: "build-tooling"
    decision: "vendor"
    vendor: "Vite + React 18 + TypeScript (strict)"
    rationale: "Single-page client-only game; no server, no SSR. Vite gives instant dev server and a static build."
    source: "interactive-review"
    job_origin: "maze-core"
    date: "2026-11-09"
  - category: "rendering"
    decision: "vendor"
    vendor: "HTML Canvas 2D (browser built-in)"
    rationale: "Hundreds of moving enemies/projectiles per frame; canvas avoids React reconciliation per entity. React renders only the HUD/panels around it. No game-engine dependency."
    source: "interactive-review"
    job_origin: "maze-core"
    date: "2026-11-09"
  - category: "state-management"
    decision: "custom"
    vendor: "Plain TypeScript simulation module + React useSyncExternalStore"
    rationale: "Game state is a fixed-timestep simulation, not UI state; a pure TS core keeps pathfinding/combat/economy unit-testable headless. React subscribes to a snapshot for the HUD. No Zustand/Redux needed."
    source: "interactive-review"
    job_origin: "maze-core"
    date: "2026-11-09"
  - category: "test-runner"
    decision: "vendor"
    vendor: "Vitest"
    rationale: "Native to Vite; runs the headless simulation tests fast. Browser smoke checks are done by verifiers driving the real app, not a committed E2E suite."
    source: "interactive-review"
    job_origin: "maze-core"
    date: "2026-11-09"
  - category: "code-formatting"
    decision: "vendor"
    vendor: "Biome"
    rationale: "ra-eng default: one tool for lint + format."
    source: "interactive-review"
    job_origin: "maze-core"
    date: "2026-11-09"
  - category: "git-hooks"
    decision: "vendor"
    vendor: "Husky + lint-staged"
    rationale: "ra-eng default: Biome on staged files + tsc --noEmit pre-commit."
    source: "interactive-review"
    job_origin: "maze-core"
    date: "2026-11-09"
  - category: "ci-cd-pipeline"
    decision: "vendor"
    vendor: "GitHub Actions"
    rationale: "Runs `npm run gate` on pushes to main only; PR merge proof is the nch2/gate commit status posted by the lane's local gate."
    source: "interactive-review"
    job_origin: "maze-core"
    date: "2026-11-09"
  - category: "package-manager"
    decision: "vendor"
    vendor: "npm"
    rationale: "Zero extra install step for anyone running the game locally."
    source: "interactive-review"
    job_origin: "maze-core"
    date: "2026-11-09"
