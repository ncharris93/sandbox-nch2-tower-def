contracts:
  - id: game-state
    description: "Single game-state module: grid dims, spawn/exit, towers[] and enemies[] as plain records with stable ids, money, sim time, paused flag. Extended by tower-combat, waves-economy, live-repath."
    provider: 2026-11-09-grid-and-route
    path: src/game/state.ts
    kind: module
    status: stub
    consumers: [2026-11-09-place-towers, 2026-11-09-enemies-walk]
  - id: pathfinding
    description: "Deterministic 4-dir BFS over the tile grid: route from a tile to the exit given blocked tiles; distance-to-exit field for any tile."
    provider: 2026-11-09-grid-and-route
    path: src/game/pathfinding.ts
    kind: module
    status: stub
    consumers: [2026-11-09-place-towers, 2026-11-09-enemies-walk]
  - id: placement
    description: "canPlaceTower(state, anchor) → ok | {reason}; placeTower mutates state. live-repath adds active-enemy and anti-juggle checks here."
    provider: 2026-11-09-place-towers
    path: src/game/placement.ts
    kind: module
    status: stub
    consumers: []
  - id: sim-loop
    description: "Fixed-timestep tick(state, dt) with clamped catch-up and pause; per-system update hooks (movement now; combat/waves added by later jobs)."
    provider: 2026-11-09-enemies-walk
    path: src/game/sim.ts
    kind: module
    status: stub
    consumers: []
